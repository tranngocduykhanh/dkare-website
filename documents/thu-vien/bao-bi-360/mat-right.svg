<text x="16" y="264.7" font-family="Arial, sans-serif" font-size="10.5" font-weight="400" fill="#ff929c">[Tỷ lệ + đơn vị pha]</text>
<text x="16" y="326" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">SÚNG / KHÍ / LỚP</text>
<text x="16" y="347" font-family="Arial, sans-serif" font-size="10.5" font-weight="400" fill="#ff929c">[Thông số theo TDS VPL]</text>
<text x="16" y="421" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">KHÔ / ĐÓNG RẮN</text>
<text x="16" y="442" font-family="Arial, sans-serif" font-size="10.5" font-weight="400" fill="#ff929c">[Điều kiện theo TDS VPL]</text>
