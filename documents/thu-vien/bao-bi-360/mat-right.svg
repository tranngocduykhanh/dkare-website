<text x="16" y="106" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">CÁC BƯỚC THỰC HIỆN</text>
<text x="16" y="127" font-family="Arial, sans-serif" font-size="10.5" font-weight="400" fill="#ff929c">[Chờ hướng dẫn VPL]</text>
<text x="16" y="141.7" font-family="Arial, sans-serif" font-size="10.5" font-weight="400" fill="#ff929c">Chuẩn bị - xử lý nền - phun - làm khô.</text>
<text x="16" y="229" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">CHẤT PHA / TỶ LỆ</text>
