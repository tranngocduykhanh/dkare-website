<rect x="14" y="98" width="272" height="97" fill="#fff8f7" stroke="#bd2538" stroke-width="1"/>
<text x="24" y="122" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#bd2538">KHU VỰC GHS</text>
<text x="24" y="136.7" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#bd2538">[Chờ phân loại,</text>
<text x="24" y="151.39999999999998" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#bd2538">biểu tượng và câu nhãn]</text>
<text x="16" y="230" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">PHÒNG NGỪA</text>
<text x="16" y="251" font-family="Arial, sans-serif" font-size="10.5" font-weight="400" fill="#ff929c">Tránh nguồn phát lửa.</text>
<text x="16" y="265.7" font-family="Arial, sans-serif" font-size="10.5" font-weight="400" fill="#ff929c">Làm việc nơi thông thoáng.</text>
<text x="16" y="280.4" font-family="Arial, sans-serif" font-size="10.5" font-weight="400" fill="#ff929c">Đóng kín sau sử dụng.</text>
<text x="16" y="334" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">BẢO QUẢN</text>
<text x="16" y="355" font-family="Arial, sans-serif" font-size="10.5" font-weight="400" fill="#ff929c">Nơi mát, thông thoáng.</text>
<text x="16" y="369.7" font-family="Arial, sans-serif" font-size="10.5" font-weight="400" fill="#ff929c">[Chốt điều kiện cụ thể]</text>
<text x="16" y="437" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">SỰ CỐ / LIÊN HỆ</text>
<text x="16" y="458" font-family="Arial, sans-serif" font-size="10.5" font-weight="400" fill="#ff929c">[Số khẩn cấp phù hợp]</text>
<text x="16" y="472.7" font-family="Arial, sans-serif" font-size="10.5" font-weight="400" fill="#ff929c">[Tham chiếu SDS đúng mã]</text>
