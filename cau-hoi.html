<section class="py-16"><div class="max-w-3xl mx-auto px-6"><h1 class="text-4xl font-bold text-primary mb-4">Câu hỏi thường gặp</h1><p class="text-text-secondary text-lg mb-10">20+ câu hỏi phổ biến về sản phẩm và dịch vụ D.KARE.</p>
<div class="space-y-3" id="faq-list"></div></div></section></main>
<footer class="bg-primary py-8"><div class="text-center"><p class="text-white/40 text-sm">&copy; 2025 D.KARE Việt Nam.</p></div></footer>
<script>
const faqs=[{q:"Sơn DN-1 có bền với nhiệt độ trong xe không?",a:"Có. DN-1 chịu nhiệt đến 120°C, không phai màu, không bong tróc."},{q:"Tôi có thể mua lẻ để dùng thử không?",a:"Có. Liên hệ <a href='tel:0795397519' class='text-accent font-medium'>079 539 7519</a> để đặt mua số lượng nhỏ."},{q:"D.KARE có hỗ trợ kỹ thuật không?",a:"Có. Chúng tôi cung cấp tài liệu hướng dẫn và hỗ trợ qua điện thoại."},{q:"Có giao hàng toàn quốc không?",a:"Có. Giao toàn quốc, Đà Nẵng giao nhanh trong ngày."},{q:"Màu sơn có giống màu nguyên bản không?",a:"D.KARE cung cấp bảng màu chuẩn. Liên hệ để được tư vấn phối màu theo xe."},{q:"Sản phẩm có bảo hành không?",a:"Có. Bảo hành 30 ngày đối với lỗi sản xuất. <a href='bao-hanh.html' class='text-accent font-medium'>Xem chi tiết</a>."},{q:"Thời gian giao hàng bao lâu?",a:"Đà Nẵng: 1-24h. Tỉnh khác: 2-5 ngày. <a href='van-chuyen.html' class='text-accent font-medium'>Xem chính sách vận chuyển</a>."},{q:"Có được đổi trả nếu sản phẩm lỗi không?",a:"Có. Đổi trả trong 7 ngày. <a href='doi-tra.html' class='text-accent font-medium'>Xem chính sách đổi trả</a>."},{q:"Sơn nhựa DN-1 có mấy màu?",a:"5 màu: Đen, Trắng (cơ bản) + Cam đậm, Tím đỏ (đặc biệt) + có thể pha theo yêu cầu."},{q:"Sơn da DL-1 dùng được cho loại da nào?",a:"Phù hợp với da thật, da công nghiệp và hầu hết bề mặt da nội thất ô tô."},{q:"Có cần sơn lót trước khi sơn màu không?",a:"Có. Với nhựa cần sơn lót PP, với da cần sơn lót Primer để đảm bảo độ bám dính."},{q:"Một lít sơn phủ được diện tích bao nhiêu?",a:"Khoảng 8-10m² tùy bề mặt và kỹ thuật thi công."},{q:"D.KARE có chương trình đại lý không?",a:"Có. <a href='dai-ly.html' class='text-accent font-medium'>Xem chương trình đại lý</a> hoặc liên hệ để biết chi tiết."},{q:"Có tài liệu hướng dẫn không?",a:"Có. <a href='tai-lieu.html' class='text-accent font-medium'>Tải tài liệu kỹ thuật</a> miễn phí."},{q:"Có video hướng dẫn không?",a:"Có. <a href='video.html' class='text-accent font-medium'>Xem video hướng dẫn</a> trên website."},{q:"Sơn có mùi không? Có độc hại không?",a:"Sơn gốc nước, ít mùi, an toàn khi sử dụng trong không gian thông thoáng."},{q:"Thời gian khô hoàn toàn là bao lâu?",a:"Khô bề mặt sau 30 phút, khô hoàn toàn sau 24h ở nhiệt độ phòng."},{q:"Có cần pha loãng sơn không?",a:"Không cần pha loãng. Chỉ cần pha với chất đóng rắn theo tỉ lệ hướng dẫn."},{q:"D.KARE có nhận thi công không?",a:"D.KARE cung cấp sản phẩm và hỗ trợ kỹ thuật. Vui lòng liên hệ để được giới thiệu gara đối tác."},{q:"Làm sao để được tư vấn báo giá?",a:"Gọi <a href='tel:0795397519' class='text-accent font-medium'>079 539 7519</a> hoặc <a href='lien-he.html' class='text-accent font-medium'>gửi yêu cầu</a>."}];
const faqList=document.getElementById('faq-list');
faqs.forEach((f,i)=>{const d=document.createElement('div');d.className='bg-surface rounded-xl border';d.innerHTML=`<button class="faq-toggle w-full flex items-center justify-between px-6 py-5 text-left font-semibold text-primary hover:text-accent" aria-expanded="false"><span>${f.q}</span><i data-lucide="chevron-down" class="faq-icon w-5 h-5 text-text-secondary"></i></button><div class="faq-answer px-6"><p class="text-text-secondary leading-relaxed pb-5">${f.a}</p></div>`;faqList.appendChild(d)});
lucide.createIcons();
document.getElementById('mobile-menu-btn').addEventListener('click',()=>{const m=document.getElementById('mobile-menu'),i=document.getElementById('menu-icon'),o=m.classList.contains('hidden');m.classList.toggle('hidden');i.setAttribute('data-lucide',o?'x':'menu');lucide.createIcons()});
document.querySelectorAll('.faq-toggle').forEach(b=>b.addEventListener('click',()=>{const a=b.nextElementSibling,i=b.querySelector('.faq-icon'),o=b.getAttribute('aria-expanded')==='true';document.querySelectorAll('.faq-toggle').forEach(x=>{if(x!==b){x.setAttribute('aria-expanded','false');x.nextElementSibling.classList.remove('open');x.querySelector('.faq-icon').style.transform='rotate(0deg)'}});b.setAttribute('aria-expanded',!o);a.classList.toggle('open',!o);i.style.transform=o?'rotate(0deg)':'rotate(180deg)'}));
</script>
