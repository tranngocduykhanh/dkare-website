<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">Cách dùng tham khảo — Lớp phủ bóng gốc nước 328C</title><desc id="desc">Chọn bề mặt và thử độ bóng/tương thích với màu. Xác nhận tỷ lệ pha theo TDS và dụng cụ phun. Phun theo hướng dẫn nhà cung cấp. Chờ đóng rắn rồi đánh giá độ bóng và cảm giác bề mặt.</desc><rect width="1200" height="1200" fill="#faf9f6"/><g font-family="Arial,Helvetica,sans-serif"><text x="74" y="103" font-size="67" font-weight="800">D</text><path d="M140 70 C128 89 128 101 140 104 C152 101 152 89 140 70" fill="#bb2227"/><text x="165" y="103" font-size="67" font-weight="800" letter-spacing="3">KARE</text><text x="1126" y="91" text-anchor="end" fill="#873c24" font-size="24">328C</text><path d="M0 155 H1200 V335 Q920 395 0 335 Z" fill="#44271d"/><text x="76" y="267" font-size="30" fill="#f7f3ef">Lớp phủ bóng gốc nước 328C</text><text x="76" y="218" fill="#fff" font-size="43" font-weight="700">Cách dùng tham khảo</text><rect x="74" y="403" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="430" font-size="32" fill="#343434">Chọn bề mặt và thử độ bóng/tương thích với màu.</text><rect x="74" y="464" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="491" font-size="32" fill="#343434">Xác nhận tỷ lệ pha theo TDS và dụng cụ phun.</text><rect x="74" y="525" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="552" font-size="32" fill="#343434">Phun theo hướng dẫn nhà cung cấp.</text><rect x="74" y="586" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="613" font-size="32" fill="#343434">Chờ đóng rắn rồi đánh giá độ bóng và cảm giác bề</text><text x="108" y="656" font-size="32" fill="#343434">mặt.</text><path d="M0 1130 H1200" stroke="#d3c9bf"/><text x="76" y="1173" font-size="21" fill="#666">dkare.vn · Thông tin tham khảo, xác nhận trước thi công</text><text x="1124" y="1173" font-size="21" fill="#873c24" text-anchor="end">4 / 5</text></g></svg>