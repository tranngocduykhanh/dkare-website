<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">Cách dùng tham khảo — Chất pha loãng sơn da gốc nước</title><desc id="desc">Xác nhận sơn, cách phun và tỷ lệ tính theo g hay ml. Chuẩn bị lượng sơn cần dùng, thêm 806D theo hướng dẫn đúng công thức. Khuấy/đồng nhất hỗn hợp và thử phun trước thi công. Thi công và hoàn thiện theo quy trình của sơn.</desc><rect width="1200" height="1200" fill="#faf9f6"/><g font-family="Arial,Helvetica,sans-serif"><text x="74" y="103" font-size="67" font-weight="800">D</text><path d="M140 70 C128 89 128 101 140 104 C152 101 152 89 140 70" fill="#bb2227"/><text x="165" y="103" font-size="67" font-weight="800" letter-spacing="3">KARE</text><text x="1126" y="91" text-anchor="end" fill="#873c24" font-size="24">806D</text><path d="M0 155 H1200 V335 Q920 395 0 335 Z" fill="#44271d"/><text x="76" y="267" font-size="30" fill="#f7f3ef">Chất pha loãng sơn da gốc nước</text><text x="76" y="218" fill="#fff" font-size="43" font-weight="700">Cách dùng tham khảo</text><rect x="74" y="403" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="430" font-size="32" fill="#343434">Xác nhận sơn, cách phun và tỷ lệ tính theo g hay</text><text x="108" y="473" font-size="32" fill="#343434">ml.</text><rect x="74" y="507" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="534" font-size="32" fill="#343434">Chuẩn bị lượng sơn cần dùng, thêm 806D theo hướng</text><text x="108" y="577" font-size="32" fill="#343434">dẫn đúng công thức.</text><rect x="74" y="611" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="638" font-size="32" fill="#343434">Khuấy/đồng nhất hỗn hợp và thử phun trước thi</text><text x="108" y="681" font-size="32" fill="#343434">công.</text><rect x="74" y="715" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="742" font-size="32" fill="#343434">Thi công và hoàn thiện theo quy trình của sơn.</text><path d="M0 