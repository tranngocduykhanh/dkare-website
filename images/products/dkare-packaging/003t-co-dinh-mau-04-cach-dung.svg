<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">Cách dùng tham khảo — Chất cố định màu 003T</title><desc id="desc">Chọn đúng độ bóng và thử trên hệ màu cần phủ. Chờ lớp màu khô theo hướng dẫn của hệ. Thi công trực tiếp lớp phủ theo hướng dẫn đúng biến thể. Chờ đóng rắn và kiểm tra cảm giác, độ bóng, chuyển màu trước sử dụng.</desc><rect width="1200" height="1200" fill="#faf9f6"/><g font-family="Arial,Helvetica,sans-serif"><text x="74" y="103" font-size="67" font-weight="800">D</text><path d="M140 70 C128 89 128 101 140 104 C152 101 152 89 140 70" fill="#bb2227"/><text x="165" y="103" font-size="67" font-weight="800" letter-spacing="3">KARE</text><text x="1126" y="91" text-anchor="end" fill="#873c24" font-size="24">003T</text><path d="M0 155 H1200 V335 Q920 395 0 335 Z" fill="#44271d"/><text x="76" y="267" font-size="30" fill="#f7f3ef">Chất cố định màu 003T</text><text x="76" y="218" fill="#fff" font-size="43" font-weight="700">Cách dùng tham khảo</text><rect x="74" y="403" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="430" font-size="32" fill="#343434">Chọn đúng độ bóng và thử trên hệ màu cần phủ.</text><rect x="74" y="464" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="491" font-size="32" fill="#343434">Chờ lớp màu khô theo hướng dẫn của hệ.</text><rect x="74" y="525" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="552" font-size="32" fill="#343434">Thi công trực tiếp lớp phủ theo hướng dẫn đúng</text><text x="108" y="595" font-size="32" fill="#343434">biến thể.</text><rect x="74" y="629" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="656" font-size="32" fill="#343434">Chờ đóng rắn và kiểm tra cảm giác, độ bóng,</text><text x="108" y="699" font-size="32" fill="#343434">chuyển màu trước sử dụng.</text><path d="M0 1130 H1200" stroke="#d3c9bf"/><text x="76" y="1173" font-size="21" fill="#666">dkare.vn · Thông 