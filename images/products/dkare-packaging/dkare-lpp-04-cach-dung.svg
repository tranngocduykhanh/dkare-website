<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">Cách dùng tham khảo — Sơn lót PP</title><desc id="desc">Xác nhận chi tiết là nhựa PP. Gửi vật liệu và hệ sơn đang dùng để được tư vấn. Dùng theo hướng dẫn đúng mã LPP và thử trên mẫu trước.</desc><rect width="1200" height="1200" fill="#faf9f6"/><g font-family="Arial,Helvetica,sans-serif"><text x="74" y="103" font-size="67" font-weight="800">D</text><path d="M140 70 C128 89 128 101 140 104 C152 101 152 89 140 70" fill="#bb2227"/><text x="165" y="103" font-size="67" font-weight="800" letter-spacing="3">KARE</text><text x="1126" y="91" text-anchor="end" fill="#5d6064" font-size="24">LPP</text><path d="M0 155 H1200 V335 Q920 395 0 335 Z" fill="#33383e"/><text x="76" y="267" font-size="30" fill="#f7f3ef">Sơn lót PP</text><text x="76" y="218" fill="#fff" font-size="43" font-weight="700">Cách dùng tham khảo</text><rect x="74" y="403" width="5" height="32" rx="2" fill="#5d6064"/><text x="108" y="430" font-size="32" fill="#343434">Xác nhận chi tiết là nhựa PP.</text><rect x="74" y="464" width="5" height="32" rx="2" fill="#5d6064"/><text x="108" y="491" font-size="32" fill="#343434">Gửi vật liệu và hệ sơn đang dùng để được tư vấn.</text><rect x="74" y="525" width="5" height="32" rx="2" fill="#5d6064"/><text x="108" y="552" font-size="32" fill="#343434">Dùng theo hướng dẫn đúng mã LPP và thử trên mẫu</text><text x="108" y="595" font-size="32" fill="#343434">trước.</text><path d="M0 1130 H1200" stroke="#d3c9bf"/><text x="76" y="1173" font-size="21" fill="#666">dkare.vn · Thông tin tham khảo, xác nhận trước thi công</text><text x="1124" y="1173" font-size="21" fill="#5d6064" text-anchor="end">4 / 5</text></g></svg>