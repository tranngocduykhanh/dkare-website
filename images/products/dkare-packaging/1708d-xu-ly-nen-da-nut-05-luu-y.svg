<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">Lưu ý trước khi dùng — Chất xử lý nền da nứt</title><desc id="desc">Dùng riêng không phục hồi hoàn chỉnh theo chính hướng dẫn nguồn. Không thay bả, keo dán hoặc tự đồng nhất với lót tăng bám.</desc><rect width="1200" height="1200" fill="#faf9f6"/><g font-family="Arial,Helvetica,sans-serif"><g transform="translate(74 51) scale(.44)"><path fill="#c62335" d="M0 0H81Q91 0 97 10L110 31Q119 51 101 68L83 82Q74 90 63 83L36 64H72Q78 64 83 57L94 45H0Z M0 78Q0 64 14 64H26L116 131H57L0 91Z"/></g><text x="139" y="103" font-size="61" font-weight="800" fill="#18232b" letter-spacing="-1">REVOX</text><text x="1126" y="91" text-anchor="end" fill="#873c24" font-size="24">1708D</text><path d="M0 155 H1200 V335 Q920 395 0 335 Z" fill="#44271d"/><text x="76" y="267" font-size="30" fill="#f7f3ef">Chất xử lý nền da nứt</text><text x="76" y="218" fill="#fff" font-size="43" font-weight="700">Lưu ý trước khi dùng</text><rect x="74" y="403" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="430" font-size="32" fill="#343434">Dùng riêng không phục hồi hoàn chỉnh theo chính</text><text x="108" y="473" font-size="32" fill="#343434">hướng dẫn nguồn. Không thay bả, keo dán hoặc tự</text><text x="108" y="516" font-size="32" fill="#343434">đồng nhất với lót tăng bám.</text><path d="M0 1130 H1200" stroke="#d3c9bf"/><text x="76" y="1173" font-size="21" fill="#666">REVOX · Thông tin tham khảo, xác nhận trước thi công</text><text x="1124" y="1173" font-size="21" fill="#873c24" text-anchor="end">5 / 5</text></g></svg>