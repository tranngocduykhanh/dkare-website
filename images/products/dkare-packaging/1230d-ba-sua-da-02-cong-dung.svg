<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">Công dụng — Bả sửa da và phục hồi vân</title><desc id="desc">Bả lấp vùng lõm và hư hỏng bề mặt da trơn trước khi lên màu. Hồ sơ nhà cung cấp có hướng dẫn chà phẳng và ép lại vân trên vùng trám.</desc><rect width="1200" height="1200" fill="#faf9f6"/><g font-family="Arial,Helvetica,sans-serif"><g transform="translate(74 51) scale(.44)"><path fill="#c62335" d="M0 0H81Q91 0 97 10L110 31Q119 51 101 68L83 82Q74 90 63 83L36 64H72Q78 64 83 57L94 45H0Z M0 78Q0 64 14 64H26L116 131H57L0 91Z"/></g><text x="139" y="103" font-size="61" font-weight="800" fill="#18232b" letter-spacing="-1">REVOX</text><text x="1126" y="91" text-anchor="end" fill="#873c24" font-size="24">1230D / 803D</text><path d="M0 155 H1200 V335 Q920 395 0 335 Z" fill="#44271d"/><text x="76" y="267" font-size="30" fill="#f7f3ef">Bả sửa da và phục hồi vân</text><text x="76" y="218" fill="#fff" font-size="43" font-weight="700">Công dụng</text><rect x="74" y="403" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="430" font-size="32" fill="#343434">Bả lấp vùng lõm và hư hỏng bề mặt da trơn trước</text><text x="108" y="473" font-size="32" fill="#343434">khi lên màu. Hồ sơ nhà cung cấp có hướng dẫn chà</text><text x="108" y="516" font-size="32" fill="#343434">phẳng và ép lại vân trên vùng trám.</text><path d="M0 1130 H1200" stroke="#d3c9bf"/><text x="76" y="1173" font-size="21" fill="#666">REVOX · Thông tin tham khảo, xác nhận trước thi công</text><text x="1124" y="1173" font-size="21" fill="#873c24" text-anchor="end">2 / 5</text></g></svg>