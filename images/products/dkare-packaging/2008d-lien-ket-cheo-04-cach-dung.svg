<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">Cách dùng tham khảo — Chất liên kết chéo hệ nước</title><desc id="desc">Xác nhận sản phẩm phối, tỷ lệ theo khối lượng/thể tích và thời gian dùng sau pha. Chuẩn bị lượng hỗn hợp vừa đủ theo hướng dẫn kỹ thuật. Phối và thi công trong điều kiện đã xác nhận. Kiểm tra sau thời gian đóng rắn của hệ.</desc><rect width="1200" height="1200" fill="#faf9f6"/><g font-family="Arial,Helvetica,sans-serif"><text x="74" y="103" font-size="67" font-weight="800">D</text><path d="M140 70 C128 89 128 101 140 104 C152 101 152 89 140 70" fill="#bb2227"/><text x="165" y="103" font-size="67" font-weight="800" letter-spacing="3">KARE</text><text x="1126" y="91" text-anchor="end" fill="#873c24" font-size="24">2008D</text><path d="M0 155 H1200 V335 Q920 395 0 335 Z" fill="#44271d"/><text x="76" y="267" font-size="30" fill="#f7f3ef">Chất liên kết chéo hệ nước</text><text x="76" y="218" fill="#fff" font-size="43" font-weight="700">Cách dùng tham khảo</text><rect x="74" y="403" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="430" font-size="32" fill="#343434">Xác nhận sản phẩm phối, tỷ lệ theo khối lượng/thể</text><text x="108" y="473" font-size="32" fill="#343434">tích và thời gian dùng sau pha.</text><rect x="74" y="507" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="534" font-size="32" fill="#343434">Chuẩn bị lượng hỗn hợp vừa đủ theo hướng dẫn kỹ</text><text x="108" y="577" font-size="32" fill="#343434">thuật.</text><rect x="74" y="611" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="638" font-size="32" fill="#343434">Phối và thi công trong điều kiện đã xác nhận.</text><rect x="74" y="672" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="699" font-size="32" fill="#343434">Kiểm tra sau thời gian đóng rắn của hệ.</text><path d="M0 1130 H1200" stroke="#d3c9bf"/><text x="76" y="1173" font-size="21" fill="#666">dkare.vn · Thông tin tham khảo, xác nhận trước thi công</text><text x="1124" y="1173" font-size="21" fill="#873c24" text-anchor="end">4 / 5</text></g></svg>