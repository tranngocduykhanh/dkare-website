<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">Cách dùng tham khảo — Chất pha loãng sơn da gốc nước</title><desc id="desc">Xác nhận sơn, cách phun và tỷ lệ tính theo g hay ml. Chuẩn bị lượng sơn cần dùng, thêm 806D theo hướng dẫn đúng công thức. Khuấy/đồng nhất hỗn hợp và thử phun trước thi công. Thi công và hoàn thiện theo quy trình của sơn.</desc><rect width="1200" height="1200" fill="#faf9f6"/><g font-family="Arial,Helvetica,sans-serif"><g transform="translate(74 51) scale(.44)"><path fill="#c62335" d="M0 0H81Q91 0 97 10L110 31Q119 51 101 68L83 82Q74 90 63 83L36 64H72Q78 64 83 57L94 45H0Z M0 78Q0 64 14 64H26L116 131H57L0 91Z"/></g><text x="139" y="103" font-size="61" font-weight="800" fill="#18232b" letter-spacing="-1">REVOX</text><text x="1126" y="91" text-anchor="end" fill="#873c24" font-size="24">806D</text><path d="M0 155 H1200 V335 Q920 395 0 335 Z" fill="#44271d"/><text x="76" y="267" font-size="30" fill="#f7f3ef">Chất pha loãng sơn da gốc nước</text><text x="76" y="218" fill="#fff" font-size="43" font-weight="700">Cách dùng tham khảo</text><rect x="74" y="403" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="430" font-size="32" fill="#343434">Xác nhận sơn, cách phun và tỷ lệ tính theo g hay</text><text x="108" y="473" font-size="32" fill="#343434">ml.</text><rect x="74" y="507" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="534" font-size="32" fill="#343434">Chuẩn bị lượng sơn cần dùng, thêm 806D theo hướng</text><text x="108" y="577" font-size="32" fill="#343434">dẫn đúng công thức.</text><rect x="74" y="611" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="638" font-size="32" fill="#343434">Khuấy/đồng nhất hỗn hợp và thử phun trước thi</text><text x="108" y="681" font-size="32" fill="#343434">công.</text><rect x="74" y="715" width="5" height="32" rx="2" fill="#873c24"/><text x="108" y="742" font-size="32" fill="#343434">Thi công và hoàn thiện theo quy trình của sơn.</text><path d="M0 1130 H1200" stroke="#d3c9bf"/><text x="76" y="1173" font-size="21" fill="#666">REVOX · Thông tin tham khảo, xác nhận trước thi công</text><text x="1124" y="1173" font-size="21" fill="#873c24" text-anchor="end">4 / 5</text></g></svg>